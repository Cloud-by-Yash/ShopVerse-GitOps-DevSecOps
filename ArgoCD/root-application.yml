apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopverse-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Cloud-by-Yash/ShopVerse-GitOps-DevSecOps.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shopverse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true