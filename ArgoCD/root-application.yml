apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopverse-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: frontend=cloudwithyash/shopverse-front, backend=cloudwithyash/shopverse-back

    argocd-image-updater.argoproj.io/frontend.update-strategy: latest
    argocd-image-updater.argoproj.io/backend.update-strategy: latest
    
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
spec:
  project: default
  source:
    repoURL: 'https://github.com/Cloud-by-Yash/ShopVerse-GitOps-DevSecOps.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shopverse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true